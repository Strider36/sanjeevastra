<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Sanjeev Astra</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sanjeev Astra">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  
  <style>
    body {
      background-color: var(--background);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-premium);
      border-radius: var(--radius-xl);
      padding: 40px;
    }
    
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--primary);
      justify-content: center;
      margin-bottom: 30px;
    }
    
    .auth-logo svg {
      width: 28px;
      height: 28px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2.5;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    
    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 6px;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div style="position: absolute; top: 20px; right: 20px;" id="auth-lang-selector"></div>

  <div class="auth-card">
    <a href="/" class="auth-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-linecap="round"/></svg>
      <span data-i18n="app.name">Sanjeev Astra</span>
    </a>
    
    <div class="auth-header">
      <h2 class="auth-title" data-i18n="auth.signInTitle">Sign in to your Vault</h2>
      <p class="auth-subtitle" data-i18n="auth.signInSubtitle">Welcome back! Please enter your details below.</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label" data-i18n="auth.email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autocomplete="username">
      </div>
      
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="password" class="form-label" style="margin-bottom: 0;" data-i18n="auth.password">Password</label>
          <a href="#" style="font-size: 0.8rem; color: var(--primary); font-weight: 500;" onclick="alert('Demo placeholder: Please register a new account if you have forgotten details.')">Forgot Password?</a>
        </div>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600; margin-top: 8px;">
        <span data-i18n="auth.signInBtn">Sign In</span>
      </button>
    </form>
    
    <div class="auth-footer">
      <span data-i18n="auth.noAccount">Don't have an account?</span> <a href="/register.html" data-i18n="auth.registerLink">Create an account</a>
    </div>
  </div>

  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import { renderLanguageSelector } from '/js/i18n.js';
    renderLanguageSelector(document.getElementById('auth-lang-selector'));
    
    // Theme alignment helper
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    }

    // Register Service Worker for offline launch
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[SW] Registration note:', err);
        });
      });
    }
  </script>
</body>
</html>
